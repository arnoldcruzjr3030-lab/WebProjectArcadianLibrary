<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcadian - Login & Portal Access</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-900 font-sans min-h-screen text-slate-100 flex flex-col justify-between items-center p-4">

  <!-- Header Branding -->
  <div class="w-full max-w-md flex justify-between items-center py-4">
    <a href="index.html" class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl shadow-md">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Arcadian</h1>
        <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider">Library Portal</p>
      </div>
    </a>
    <a href="index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1 font-semibold">
      <i class="fa-solid fa-arrow-left"></i> Home
    </a>
  </div>

  <!-- Authentication Card -->
  <div class="w-full max-w-md bg-slate-800 border border-slate-700/80 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-1">
      <h2 id="auth-title" class="text-2xl font-bold text-white tracking-tight">Welcome Back</h2>
      <p id="auth-subtitle" class="text-xs text-slate-400">Sign in to access Arcadian Library Portal</p>
    </div>

    <!-- Error Alert Box -->
    <div id="auth-error" class="hidden p-3.5 bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold rounded-xl text-center"></div>

    <form id="auth-form" class="space-y-4">
      
      <!-- Student ID Field (Visible during Sign Up) -->
      <div id="student-id-container" class="hidden">
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Student ID Number *</label>
        <div class="relative">
          <input type="text" id="auth-student-id" placeholder="e.g. 2026-10492" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 font-medium">
          <i class="fa-solid fa-id-card absolute left-3.5 top-3 text-slate-500 text-xs"></i>
        </div>
      </div>

      <!-- Email Field -->
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Email Address *</label>
        <div class="relative">
          <input type="email" id="auth-email" required placeholder="student@school.edu" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 font-medium">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-500 text-xs"></i>
        </div>
      </div>

      <!-- Password Field with Password Visibility Toggle -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-bold text-slate-300">Password *</label>
          <button type="button" id="forgot-password-link" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-semibold">
            Forgot Password?
          </button>
        </div>
        <div class="relative">
          <input type="password" id="auth-password" required placeholder="••••••••" class="w-full pl-10 pr-11 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 font-medium">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          
          <!-- Toggle Password Visibility Eye Button -->
          <button type="button" id="toggle-password-visibility" class="absolute right-3.5 top-2.5 text-slate-400 hover:text-slate-200 text-xs p-0.5 focus:outline-none transition" title="Toggle password visibility">
            <i id="password-eye-icon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Form Submit Button -->
      <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg transition duration-150">
        Sign In
      </button>

    </form>

    <!-- Social Sign In Divider -->
    <div class="relative flex items-center justify-center my-4">
      <div class="border-t border-slate-700 w-full"></div>
      <span class="bg-slate-800 px-3 text-[10px] uppercase font-bold text-slate-500 tracking-wider absolute">OR</span>
    </div>

    <!-- Google Sign-In Button -->
    <button id="google-signin-btn" type="button" class="w-full bg-slate-900 hover:bg-slate-950 text-slate-200 border border-slate-700 font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2">
      <i class="fa-brands fa-google text-red-400 text-sm"></i> Continue with Google
    </button>

    <!-- Sign In / Sign Up Mode Switcher -->
    <div class="text-center pt-2">
      <button type="button" id="toggle-auth-mode" class="text-xs text-slate-400 hover:text-indigo-400 font-semibold transition">
        Don't have an account? Sign Up
      </button>
    </div>
  </div>

  <!-- Footer -->
  <p class="text-[11px] text-slate-500 font-medium py-4">
    Arcadian Library Management System &copy; 2026
  </p>

  <script type="module" src="app.js"></script>
</body>
</html>
